<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Font Test</title>
  <link rel="stylesheet" href="CarleighPortfolio.css">
  <style>
    body {
      padding: 2rem;
    }
    .test {
      font-size: 2rem;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <h1>Font Test Page</h1>
  
  <div class="test" style="font-family: 'Glacial Indifference', sans-serif;">
    This should display in Glacial Indifference (Regular)
  </div>
  
  <div class="test" style="font-family: 'Glacial Indifference', sans-serif; font-weight: bold;">
    This should display in Glacial Indifference (Bold)
  </div>
  
  <p>Testing the actual page fonts inherited from body:</p>
  <p>Body text should use Glacial Indifference</p>
  
</body>
</html>
